[project]
name = "video-graphic-snatcher"
version = "0.1.0"
description = "Local companion for the YouTube Motion Graphic Snatcher Chrome extension"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "keyring>=25.6.0",
  "pydantic>=2.11.0",
  "uvicorn[standard]>=0.35.0",
  "yt-dlp>=2025.6.30",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "respx>=0.22.0",
  "ruff>=0.12.0",
]

[project.scripts]
snatcher = "snatcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snatcher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

